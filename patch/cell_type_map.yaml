# Annotation_main_types_new -> tumor / stroma_hormonal / stroma_matrix / undefined
#
# ЧТО ИЗМЕНИЛОСЬ: класс "stroma" разделён на два по литобзору (раздел 1.4):
#   stroma_hormonal — собственная строма яичника, способная к стероидогенезу
#   stroma_matrix   — десмопластическая строма: CAF + внеклеточный матрикс
#
# ВАЖНО: иммунные и эндотелиальные клетки БОЛЬШЕ НЕ строма.
# Раньше T/B/NK/Myeloid/Endothelial попадали в "stroma", из-за чего "доля
# стромы" была на самом деле "доля всего, что не опухоль" — а TSR в
# литературе это про соединительную ткань, не про лимфоциты.
# Теперь они в отдельной группе и по умолчанию не считаются в TSR.

match_mode: exact
case_insensitive: true

groups:
  tumor:
    - Cancer cells

  # Гормон-продуцирующая (функционирующая) строма яичника.
  # Морфология на H&E: рыхлые веретеновидные клетки, эозинофильная или
  # светлая цитоплазма. Молекулярно: ферменты синтеза стероидов
  # (STAR, CYP11A1, CYP17A1, HSD3B2), FOXL2, NR5A1, INHA.
  stroma_hormonal:
    - NFs                      # normal fibroblasts яичниковой стромы
    - Granulosa cells
    - Theca cells
    - Luteinized cells
    - Steroidogenic cells

  # Матриксная (десмопластическая) строма.
  # Морфология: плотные пучки коллагеновых волокон, мало ядер.
  # Молекулярно: COL1A1/COL1A2/COL3A1, FAP, POSTN, LUM, DCN, ACTA2.
  stroma_matrix:
    - CAFs
    - Fibroblasts
    - SMC
    - Pery tumor
    - Pery normal
    - Perycites
    - Pericytes

  # Не строма для целей TSR: сосуды и иммунные клетки.
  # Их доля считается отдельно как самостоятельный признак.
  vessels_immune:
    - EC cells tumor
    - EC cells normal
    - Endo
    - Endothelial cells
    - Lymphatic endothelial cells
    - T cells
    - B cells
    - NK
    - Lymph
    - Lymphoid cells
    - Plasma cells
    - Plasma
    - Myeloid cells
    - Mye
    - DC
    - Mast cells

  undefined:
    - Ciliated epithelial cells
    - Fallopian tube epithelium
    - Mesothelial cells

unmapped_policy: undefined
